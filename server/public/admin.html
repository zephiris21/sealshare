<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>명단 · sealshare</title>
<style>
  :root { color-scheme: light dark; --bg:#FFFEFB; --card:#FFFFFF; --ink:#262521; --ink2:#57544D; --muted:#8a867f; --line:#ECE9E2; --btn:#F2F0E9; --warn:#B3261E; --ok:#2F6B45; --hi:#FFF4D6; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1F1E1C; --card:#2A2926; --ink:#F2F0EA; --ink2:#C9C5BC; --muted:#9A968D; --line:#34322E; --btn:#34322E; --warn:#F2B8B5; --ok:#8FCDA2; --hi:#3A3222; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", sans-serif; word-break: keep-all; }
  main { max-width: 760px; margin: 0 auto; padding: 28px 16px 64px; }
  h1 { font-size: 24px; margin: 0; } h2 { font-size: 16px; margin: 28px 0 10px; color: var(--ink2); }
  .sub { color: var(--muted); font-size: 14px; margin: 6px 0 18px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-bottom: 10px;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .who { flex: 1; min-width: 160px; } .name { font-weight: 700; font-size: 16px; } .meta { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .gone { opacity: .6; }
  button { appearance: none; border: 0; border-radius: 10px; padding: 9px 14px; font: inherit; font-size: 14px; font-weight: 600; background: var(--btn); color: var(--ink); cursor: pointer; }
  button.primary { background: var(--ink); color: var(--bg); }
  button.danger { color: var(--warn); } button.danger.armed { background: var(--warn); color: var(--bg); }
  .add { display: flex; gap: 8px; }
  input { flex: 1; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font: inherit; }
  .issued { background: var(--hi); border-radius: 14px; padding: 16px; margin-top: 12px; line-height: 1.6; }
  .issued code { display: block; margin: 8px 0; padding: 10px; border-radius: 8px; background: var(--card); word-break: break-all; font-size: 13px; }
  .link { display: block; margin: 8px 0; padding: 10px; border-radius: 8px; background: var(--card); word-break: break-all; font-size: 12.5px; color: var(--ink2); }
  h2 .meta { font-weight: 400; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .err { color: var(--warn); } .note { color: var(--muted); font-size: 12.5px; line-height: 1.6; margin-top: 28px; border-top: 1px solid var(--line); padding-top: 14px; }
</style>
</head>
<body>
<main>
  <h1>🔑 sealshare 명단</h1>
  <div class="sub" id="sub">여는 중…</div>
  <div id="login" hidden>
    <input id="tok" placeholder="운영자 열쇠 sa_…" autocomplete="off" autocapitalize="off" spellcheck="false">
    <div class="row"><button id="go" class="primary">열기</button></div>
  </div>
  <div id="app" hidden>
    <h2>초대장 보내기 <span class="meta">— 추천. 친구가 링크를 열어 열쇠를 직접 받아요(한 번만)</span></h2>
    <div class="add"><input id="invName" placeholder="이름 (예: 철수)" maxlength="40"><button id="invBtn" class="primary">초대장 만들기</button></div>
    <div id="invOut"></div>
    <div id="invites"></div>
    <h2>열쇠 파일로 직접 추가</h2>
    <div class="add"><input id="newName" placeholder="이름 (예: 철수)" maxlength="40"><button id="addBtn">추가</button></div>
    <div id="issued"></div>
    <h2>올릴 수 있는 사람</h2>
    <div id="people"></div>
    <div id="orphan"></div>
  </div>
  <div class="note">
    공유 «수·용량»만 보입니다 — 내용과 각자의 목록은 암호문이라 운영자도 볼 수 없습니다.<br>
    ⚠ 이 페이지 주소(# 뒤)에는 <b>운영자 열쇠</b>가 들어 있습니다. 남에게 보내지 마세요.
  </div>
</main>
<script src="/admin.js"></script>
</body>
</html>
