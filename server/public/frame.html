<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title></title>
</head>
<body>
<script>
// 내용을 띄우는 틀 — «다른 주소»(frame.…)에서 돈다.
// 보기 화면(열쇠가 주소창에 있는 쪽)과 출처가 달라서, 여기 들어온 스크립트는 그쪽을 못 만진다.
// 그러면서 이 틀 안에서는 같은 출처라 주소 조작·저장소 같은 평범한 웹 기능이 그대로 돈다.
(function () {
  var host = location.hostname;                     // frame.sealshare.pages.dev
  var parentOrigin = "https://" + host.replace(/^frame\./, "");
  window.addEventListener("message", function (e) {
    if (e.origin !== parentOrigin || !e.data || e.data.type !== "sealshare:render") return;
    document.open();
    document.write(e.data.html);
    document.close();
  });
  parent.postMessage({ type: "sealshare:ready" }, parentOrigin);
})();
</script>
</body>
</html>
